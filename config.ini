# MySQL 配置
[mysql]
host = 127.0.0.1
port = 3307
user = root
password = 123456
database = edurag
table = jpkb

# Redis 配置
[redis]
host = 127.0.0.1
port = 6379
password = 123456
db = 0
# 缓存过期时间 180秒
ttl = 180
# 缓存一天
# ttl = 86400

# 日志配置
[log]
# 日志文件目录 相对于项目根路径的位置
log_dir = logs
# 日志级别对应数字
# DEBUG=10 INFO=20 WARNING=30 ERROR=40 CRITICAL=50
# 日志控制台级别
log_console_level = 20
# 日志文件级别
log_file_level = 20

# todo =====以下为新增部分=====

# Milvus 配置
[milvus]
host = 127.0.0.1
port = 19530
# 要先创建库
database_name = edurag
collection_name = edurag_doc

[data]
# 数据文件目录在项目路径中的相对路径
data_dir = rag_qa/data

# 模型配置
[model]
# 云上llm模型名称
dashscope_model = qwen3.7-flash
# 阿里云Dashscope API密钥
# dashscope_api_key = sk-axxxxxx
# 如果密钥在环境变量中，就使用环境变量中的key名
env_api_key = AliApiKey
# 阿里云Dashscope基础URL
dashscope_base_url = https://dashscope.aliyuncs.com/compatible-mode/v1
# 本地向量模型在项目路径中的相对路径
embedding_path = rag_qa/models/bge-m3
# 本地重排序模型在项目路径中的相对路径
rerank_path = rag_qa/models/bge-reranker-large

# 本地预训练的BERT模型在项目路径中的相对路径
bert_base_path = rag_qa/models/bert-base-chinese
# 针对BERT模型微调后 新模型在项目路径中的相对路径
bert_query_classifier_path = rag_qa/models/bert-query-classifier-500
# 训练的BERT模型的数据集在项目路径中的相对路径
bert_train_data = rag_qa/classify_data/model_generic_500.json


# 检索参数配置
[retrieval]
# 父块大小
parent_chunk_size = 1200
# 子块大小
child_chunk_size = 300
# 块重叠大小
chunk_overlap = 50
# 检索结果数量
retrieval_k = 3
# 候选数量
candidate_m = 2

# 业务配置
[app]
valid_sources = ["ai", "java", "test", "ops", "bigdata"]
customer_service_phone = 12345678

# 设备配置
# 本地模型使用cpu还是gpu
[device]
device = cpu
# device = cuda